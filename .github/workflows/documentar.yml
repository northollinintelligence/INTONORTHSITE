name: Documentar cambios automáticamente

on:
  push:
    branches:
      - Diego

jobs:
  documentar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repo con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar resumen del cambio
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python /backend/scripts/documentar_cambios.py

      - name: Subir el documento actualizado
        run: |
          git config user.name "Documentador Automático"
          git config user.email "bot@northollin.com"
          git add DOCUMENTACION.md
          git diff --staged --quiet || git commit -m "docs: actualizar documentación automática [skip ci]"
          git push